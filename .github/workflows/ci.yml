name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  formatter-tests:
    name: Formatter unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Run formatter tests
        run: npx vitest run src/lib/formatters.test.ts --reporter=verbose

  link-integrity:
    name: No dead Unknown address links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Check for Unknown address as link text
        run: |
          FOUND=$(grep -rn 'href.*Unknown\|>Unknown address<' src/ app/ --include='*.tsx' --include='*.ts' 2>/dev/null || true)
          if [ -n "$FOUND" ]; then
            echo "ERROR: 'Unknown address' appears as clickable link text. Use UnresolvableEntityCard instead."
            echo "$FOUND"
            exit 1
          fi
          echo "OK: No Unknown address links found."

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit

  migration-order:
    name: Migration timestamp order
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate migration timestamps are strictly ascending
        run: |
          python3 << 'PYEOF'
          import os, sys, re
          files = sorted(f for f in os.listdir("supabase/migrations") if f.endswith(".sql"))
          prev = 0
          for f in files:
              m = re.match(r"^(\d{14})", f)
              if not m:
                  print("SKIP:", f)
                  continue
              ts = int(m.group(1))
              if ts <= prev:
                  print("ERROR:", f)
                  print("  timestamp", ts, "is not after", prev)
                  print("  rename to use a timestamp >", prev)
                  sys.exit(1)
              print("OK:", ts, f)
              prev = ts
          print("All migration timestamps are in ascending order.")
          PYEOF
