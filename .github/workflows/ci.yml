name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  formatter-tests:
    name: Formatter unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Run formatter tests
        run: npx vitest run src/lib/formatters.test.ts --reporter=verbose

  link-integrity:
    name: No dead Unknown address links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Check for Unknown address as link text
        run: |
          FOUND=$(grep -rn 'href.*Unknown\|>Unknown address<' src/ app/ --include='*.tsx' --include='*.ts' 2>/dev/null || true)
          if [ -n "$FOUND" ]; then
            echo "ERROR: 'Unknown address' appears as clickable link text. Use UnresolvableEntityCard instead."
            echo "$FOUND"
            exit 1
          fi
          echo "OK: No Unknown address links found."

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit

  migration-order:
    name: Migration timestamp order
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate migration timestamps are strictly ascending
        run: |
          prev_ts=0
          for f in $(ls supabase/migrations/*.sql | sort); do
            ts=$(basename "$f" | grep -oE '^[0-9]{14}')
            if [ -z "$ts" ]; then
              echo "SKIP (no timestamp prefix): $(basename $f)"
              continue
            fi
            if [ "$ts" -le "$prev_ts" ]; then
              echo "ERROR: $(basename $f) has timestamp $ts, which is not after previous $prev_ts"
              echo "Rename the file to use a timestamp greater than $prev_ts"
              exit 1
            fi
            echo "OK: $ts  $(basename $f)"
            prev_ts=$ts
          done
          echo "All migration timestamps are in ascending order."
