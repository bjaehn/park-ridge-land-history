name: Deploy

on:
  push:
    branches: [main]

jobs:
  supabase-migrations:
    name: Apply database migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Push migrations to Supabase
        run: |
          # --include-all records every local file into migration history so an
          # out-of-sequence file never blocks the link step.
          supabase link --project-ref ${{ vars.SUPABASE_PROJECT_REF }} --include-all
          # If the remote has migrations applied out-of-band (e.g. via MCP tools),
          # those versions won't have matching local files and db push will fail.
          # Auto-repair: remove orphan remote versions from migration history, then push.
          set +e
          PUSH_OUT=$(supabase db push 2>&1)
          EXIT=$?
          set -e
          if [ $EXIT -ne 0 ]; then
            ORPHANS=$(echo "$PUSH_OUT" | grep -oP '(?<=reverted )\d[\d ]+' | head -1 | xargs)
            if [ -n "$ORPHANS" ]; then
              echo "Repairing orphan remote migration versions: $ORPHANS"
              supabase migration repair --status reverted $ORPHANS
              supabase db push
            else
              echo "$PUSH_OUT"
              exit $EXIT
            fi
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
